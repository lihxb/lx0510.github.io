<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片展示 - 1761043061323.png</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 40px 0;
            text-align: center;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
        }
        
        .header-content {
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            font-weight: 300;
        }
        
        .image-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            margin-bottom: 40px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .image-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }
        
        .image-wrapper {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
        }
        
        .main-image {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.5s ease;
        }
        
        .main-image:hover {
            transform: scale(1.02);
        }
        
        .image-info {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .info-title {
            font-size: 1.4rem;
            color: #2575fc;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        
        .info-title i {
            margin-right: 10px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eaeaea;
        }
        
        .info-item:last-child {
            border-bottom: none;
        }
        
        .info-label {
            font-weight: 600;
            min-width: 120px;
            color: #555;
        }
        
        .info-value {
            color: #333;
        }
        
        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
        }
        
        .btn-outline {
            background: transparent;
            border: 2px solid #2575fc;
            color: #2575fc;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(0, 0, 0, 0.1);
        }
        
        .btn-primary:hover {
            box-shadow: 0 7px 15px rgba(37, 117, 252, 0.3);
        }
        
        footer {
            text-align: center;
            padding: 30px 0;
            color: #7f8c8d;
            font-size: 0.9rem;
            border-top: 1px solid #eee;
            margin-top: 50px;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            header {
                padding: 30px 0;
                margin-bottom: 30px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .image-container {
                padding: 20px;
            }
            
            .actions {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <h1>图片展示</h1>
                <p class="subtitle">展示您的精美图片 - 1761043061323.png</p>
            </div>
        </div>
    </header>
    
    <main>
        <div class="container">
            <section class="image-container">
                <div class="image-wrapper">
                    <!-- 请将1761043061323.png替换为您的图片文件路径 -->
                    <img src="1761043061323.png" alt="展示图片" class="main-image">
                </div>
                
                <div class="image-info">
                    <h2 class="info-title"><i class="fas fa-info-circle"></i> 图片信息</h2>
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="info-label">文件名:</span>
                            <span class="info-value">1761043061323.png</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">格式:</span>
                            <span class="info-value">PNG图像</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">上传日期:</span>
                            <span class="info-value">2023年6月20日</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">类别:</span>
                            <span class="info-value">艺术作品</span>
                        </div>
                    </div>
                </div>
                
                <div class="actions">
                    <button class="btn btn-primary">
                        <i class="fas fa-download"></i> 下载图片
                    </button>
                    <button class="btn btn-outline">
                        <i class="fas fa-share-alt"></i> 分享图片
                    </button>
                </div>
            </section>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <p>© 2023 图片展示网站. 保留所有权利.</p>
        </div>
    </footer>

    <script>
        // 简单的交互效果
        document.addEventListener('DOMContentLoaded', function() {
            const downloadBtn = document.querySelector('.btn-primary');
            const shareBtn = document.querySelector('.btn-outline');
            
            downloadBtn.addEventListener('click', function() {
                alert('图片下载功能已触发！在实际应用中，这里会下载图片文件。');
            });
            
            shareBtn.addEventListener('click', function() {
                alert('分享功能已触发！在实际应用中，这里会调用分享API。');
            });
            
            // 图片加载成功后的动画
            const mainImage = document.querySelector('.main-image');
            mainImage.addEventListener('load', function() {
                this.style.opacity = '0';
                this.style.transition = 'opacity 0.8s ease';
                
                setTimeout(() => {
                    this.style.opacity = '1';
                }, 200);
            });
        });
    </script>
</body>
</html>
